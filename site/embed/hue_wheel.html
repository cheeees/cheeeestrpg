@media(hover:hover){#hw-root .cs-panel.ed .cs-b i:hover{background:var(--hover)}}

#hw-root .cs-b[data-v="2"] i:nth-child(2){background:var(--main);border-color:var(--main)}
#hw-root .cs-b[data-v="3"] i:nth-child(3){background:var(--main);border-color:var(--main)}
#hw-root .cs-b[data-v="4"] i:nth-child(4){background:var(--main);border-color:var(--main)}
#hw-root .cs-b[data-v="5"] i:nth-child(5){background:var(--main);border-color:var(--main)}
#hw-root .cs-b[data-v="6"] i:nth-child(6){background:var(--main);border-color:var(--main)}
#hw-root .cs-b[data-v="7"] i:nth-child(7){background:var(--main);border-color:var(--main)}
#hw-root .cs-b[data-v="8"] i:nth-child(8){background:var(--main);border-color:var(--main)}
#hw-root .cs-b[data-v="9"] i:nth-child(9){background:var(--main);border-color:var(--main)}
#hw-root .cs-b[data-v="10"] i:nth-child(10){background:var(--main);border-color:var(--main)}

/* ===== 複数シート(プルダウン切替・シート追加) ===== */
#hw-root .csw{margin-top:22px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:10px}
#hw-root .csw .cs-panel{margin:0;padding:0;border:0;border-radius:0;background:none}

#hw-root .csw-sel{max-width:100%;min-width:0;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;font-size:13px}
#hw-root .cs-ctl{flex-wrap:wrap;justify-content:flex-end}
#hw-root .cs-ctl .cs-del{color:#c0392b;border-color:#c0392b}
#hw-root .cs-picker{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 4px;padding:8px;border:1px dashed var(--line);border-radius:8px}
#hw-root .cs-picker select{min-width:0;max-width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;font-size:13px}
#hw-root .cs-picker button{padding:5px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
#hw-root .cs-picker .cs-padd{background:var(--main);color:var(--on);border-color:var(--main)}
#hw-root .cs-cols.one{grid-template-columns:1fr}
#hw-root .cs-missing{color:var(--mut);font-size:13px}

/* 表タイプのシート */
#hw-root .cs-tbl{width:100%;border-collapse:collapse;margin-top:6px;table-layout:fixed}
#hw-root .cs-tbl th,#hw-root .cs-tbl td{border:1px solid var(--line);padding:0;vertical-align:middle}
#hw-root .cs-tbl th{width:34%;max-width:11em;padding:8px 8px;background:var(--bg);color:var(--fg);font-size:13px;font-weight:600;text-align:center;line-height:1.4}
#hw-root .cs-panel .cs-tx{display:block;width:100%;height:auto;margin:0;border-radius:0;box-sizing:border-box;min-height:2.4em;padding:8px 10px;border:0;background:transparent;color:var(--fg);font:inherit;font-size:14px;line-height:1.5;resize:none;field-sizing:content;overflow:hidden;outline:none}

/* ===== デザイン統一(ボタン・プルダウン)/ タップ時の色は即時 ===== */
#hw-root{-webkit-tap-highlight-color:transparent}
#hw-root .cs-ctl button,#hw-root .cs-picker button{box-sizing:border-box;min-height:32px;padding:5px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--mut);font:inherit;font-size:13px;line-height:1.2;white-space:nowrap;cursor:pointer;transition:none}
#hw-root .cs-ctl .cs-key{padding:5px 12px}
#hw-root .cs-ctl .cs-save,#hw-root .cs-picker .cs-padd{background:var(--main);color:var(--on);border-color:var(--main)}
#hw-root .cs-ctl .cs-del{color:#c0392b;border-color:#c0392b}
#hw-root .cs-ctl button[hidden],#hw-root .cs-picker[hidden]{display:none}
#hw-root .csw-sel,#hw-root .cs-picker select{box-sizing:border-box;min-height:32px;max-width:100%;min-width:0;padding:5px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);font:inherit;font-size:13px}
#hw-root .cs-picker{padding:8px 10px;border:1px dashed var(--line);border-radius:10px}
#hw-root .cs-ctl button:not(.cs-save):active,#hw-root .cs-picker button:not(.cs-padd):active{background:var(--hover)}

/* 見出しは折り返さない(幅は文字数に合わせる)。JSON 内の \n はスマホ(600px以下)だけ改行 */
#hw-root .cs-l,#hw-root .cs-rr{white-space:pre-line;word-break:keep-all}
#hw-root .cs-line{grid-template-columns:var(--wld,4em) 1fr var(--wrd,4em)}
#hw-root br.sp{display:none}
#hw-root .cs-tbl th{width:min(calc(var(--thd,6) * 1em + 1em + 16px),34%);white-space:pre-line;word-break:normal;overflow-wrap:anywhere}

/* 選択中(フォーカス時)の囲み枠を出さない */

  #hw-root .csw.ed .cs-ctl .cs-key{padding:4px 8px}
}

}

/* ===== 見出し「チェックシート」を枠の外へ / プルダウンは枠内の見出し位置へ ===== */
#hw-root .csw-title{margin-top:22px;font-size:14px;font-weight:700;color:var(--main);border-left:4px solid var(--accent);padding-left:8px}
#hw-root .csw-title + .csw{margin-top:8px}
#hw-root .csw-bar{flex:1 1 auto;min-width:0;margin:0}

#hw-root .csw .cs-h{margin-bottom:6px}
#hw-root .csw .cs-ctl{margin-left:auto}
@media(max-width:600px){
  #hw-root .csw .csw-bar{flex:1 1 100%}
  #hw-root .csw .cs-ctl,#hw-root .csw.ed .cs-ctl{margin-left:0;justify-content:flex-start}
}
/* 表: 見出し列を狭く / 本文の文字サイズは見出しと同じ */

}
/* 表の編集中: 入力欄をマスいっぱいに(隙間・二重線をなくす) */

#hw-root .cs-panel.ed .cs-tbl td{cursor:text}
#hw-root .cs-panel.ed .cs-tbl td{background:#fffaf0}
#hw-root .cs-panel.ed .cs-tx,#hw-root .cs-panel.ed .cs-tx:focus{background:transparent;box-shadow:none}
/* スマホでもボタンはPCと同じ大きさ・間隔(入りきらなければ折り返す) */
@media(max-width:600px){
  #hw-root .csw.ed .cs-ctl,#hw-root .csw .cs-ctl{flex-wrap:wrap;gap:6px;justify-content:flex-start}
  #hw-root .csw.ed .cs-ctl button,#hw-root .csw .cs-ctl button{flex:0 0 auto;min-height:32px;padding:5px 12px;font-size:13px}
  #hw-root .csw.ed .cs-ctl .cs-key,#hw-root .csw .cs-ctl .cs-key{padding:5px 12px}
}
/* スマホ: ボタンは必ず1行。画面幅に合わせて文字・余白・間隔を少しずつ縮める */
@media(max-width:600px){
  #hw-root .csw.ed .cs-ctl,#hw-root .csw .cs-ctl{flex-wrap:nowrap;gap:clamp(3px,1vw,6px);justify-content:flex-start}
  #hw-root .csw.ed .cs-ctl button,#hw-root .csw .cs-ctl button{flex:0 0 auto;min-height:32px;padding:5px clamp(5px,1.7vw,12px);font-size:clamp(10px,3.1vw,13px)}
  #hw-root .csw.ed .cs-ctl .cs-key,#hw-root .csw .cs-ctl .cs-key{padding:5px clamp(6px,2vw,12px)}

/* スマホ: 右端にぴったりくっつかないよう、ボタンをもう一回り小さく */

  #hw-root .csw.ed .cs-ctl .cs-key,#hw-root .csw .cs-ctl .cs-key{padding:5px clamp(5px,1.7vw,10px)}
}
/* メッセージ欄が空のときは場所を取らない / セクション間を広く、先頭セクションの上の隙間はなくす */
#hw-root .cs-msg:empty{display:none}
#hw-root .cs-panel .cs-s{margin-top:28px}
#hw-root .cs-panel .cs-s:first-child{margin-top:4px}
/* グループ間を広く / 項目名は中央揃え(先頭の「・」は表示しない) / 奇数マスの真ん中だけ薄いクリーム色 */
#hw-root .cs-cols{gap:0 36px}
@media(max-width:600px){#hw-root .cs-col+.cs-col{margin-top:22px}}
#hw-root .cs-sub{margin:10px 0 4px}
#hw-root .cs-q{text-align:center}
#hw-root .cs-b[data-m="2"]:not([data-v="2"]) i:nth-child(2),
#hw-root .cs-b[data-m="3"]:not([data-v="3"]) i:nth-child(3),
#hw-root .cs-b[data-m="4"]:not([data-v="4"]) i:nth-child(4),

#hw-root .cs-b[data-m="6"]:not([data-v="6"]) i:nth-child(6){background:var(--soft)}
/* 左右の見出し列を同じ幅にして、マスを項目名(中央揃え)の真下に中央寄せ */
#hw-root .cs-line{grid-template-columns:max(var(--wld,4em),var(--wrd,4em)) 1fr max(var(--wld,4em),var(--wrd,4em))}

/* 項目名とマスの間を広く */
#hw-root .cs-q{margin-bottom:6px}
/* カテゴリ名(セクション名)は太字 / グループ名は少し右へインデント */
#hw-root .cs-t{font-weight:700}

  #hw-root .csw.ed .cs-ctl .cs-key,#hw-root .csw .cs-ctl .cs-key{padding:5px clamp(7px,2.2vw,11px)}
}

#hw-root .card>div:has(>ul.scl):not([hidden]){padding-top:28px}

/* スマホ: ボタン文字の左右余白をさらに広げる(1行のまま。余った幅は各ボタンに均等に配分) */
@media(max-width:600px){

  #hw-root .csw .cs-ctl .cs-key,#hw-root .csw.ed .cs-ctl .cs-key{padding:5px clamp(9px,2.6vw,14px)}

}
/* ===== 説明文(✎編集中だけ表示) / 見出し(中央揃え・見出しごとに表を分離) / 縦並び / 年表 / 余白 ===== */
#hw-root .cs-tx::placeholder,#hw-root .cs-evt::placeholder{color:#b9ad9c;opacity:1}
#hw-root .cs-desc,#hw-root .cs-hdd,#hw-root .cs-sd,#hw-root .cs-tbl th .cs-d{display:none}
#hw-root .cs-panel.ed .cs-desc,#hw-root .cs-panel.ed .cs-hdd,#hw-root .cs-panel.ed .cs-sd,#hw-root .cs-panel.ed .cs-tbl th .cs-d{display:block}
#hw-root .cs-desc{margin:6px 0 14px;font-size:12px;line-height:1.7;color:var(--mut)}

#hw-root .cs-tbl th .cs-d{margin-top:4px;font-size:10.5px;font-weight:400;color:var(--mut);line-height:1.4}

#hw-root .cs-hh{margin-bottom:12px}

#hw-root .cs-tbl{margin-top:0}
#hw-root .cs-tbl th{padding:16px 10px;width:min(calc(var(--thd,6) * 1em + 24px),36%)}

@media(max-width:600px){

#hw-root .cs-panel.ed .cs-tladd{display:inline-block;margin:10px 0 0 28px;min-height:32px;padding:5px 14px;border:1px solid var(--main);border-radius:99px;background:var(--card);color:var(--main);font:inherit;font-size:13px;cursor:pointer}

#hw-root .cs-gp + .cs-gp{margin-top:30px;padding-top:24px;border-top:1px dashed var(--line)}

</style>
<script>
/* ===== チェックシート保存設定 =====
   トークンはHTMLに書きません。編集中に表示される「🔒」ボタンから、各自がこの端末で入力します
   (入力したトークンは、この端末のブラウザ内にだけ保存されます)。
   ■ シートの種類(プリセット)は data/preset/ の preset-NN.json(または NN.json)、キャラごとの入力値は data/checksheet/char-XXX.json に保存されます。
   ■ シートの種類は4つ(スライダー/表/年表/グループ追加式)に対応しています。
   ■ 固定のシートはありません。何も追加していないときはツールバー(✎ 編集)だけが表示されます。プリセットは No.1 から使えます。 */
var GH_OWNER  = "cheeees";
var GH_REPO   = "cheeeestrpg";
var GH_BRANCH = "main";
var TOKEN_KEY = "hw_gh_token"; // ブラウザ内の保存名
var memToken = "";
function getToken(){
  try{ var t=localStorage.getItem(TOKEN_KEY); if(t) return t; }catch(e){}
  return memToken;
}
function setToken(t){
  memToken=t;
  try{ if(t) localStorage.setItem(TOKEN_KEY,t); else localStorage.removeItem(TOKEN_KEY); }catch(e){}
}
function hwInit(){
  var root = document.getElementById('hw-root'); if(!root) return;
  var PRESET_DIRS=['data/preset','preset'], SHEET_DIR='data/checksheet';
  var snapshots = new WeakMap();
  q0(root,'.csw').forEach(function(w){
    if(!w.dataset.id) w.dataset.id = 'char-' + String(Number(w.dataset.c) + 1).padStart(3, '0');
  });
  function q0(el, sel){ return Array.prototype.slice.call(el.querySelectorAll(sel)); }

  /* ---------- 小道具 ---------- */
  function q(el, sel){ return Array.prototype.slice.call(el.querySelectorAll(sel)); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function msg(sheet, t, err){ var m=sheet.querySelector('.cs-msg'); if(m){m.textContent=t;m.style.color=err?'#c0392b':'';} }
  function key(b){ return b.dataset.k || b.id; }
  /* 年表・グループ追加式は「増減する入力欄」なので、まとまりごとにJSON文字列1つで保存する
     年表: tl = [{t,d},…] / グループ: g<セクション番号> = [{n:グループ名, v:{項目id:入力値}},…] */
  function parseJ(s){ try{ var a=JSON.parse(s); return Array.isArray(a)?a:null; }catch(e){ return null; } }
  function readTl(box){ return q(box,'.cs-ev').map(function(ev){ return {t:(ev.querySelector('.cs-evt')||{}).value||'', d:(ev.querySelector('.cs-tx')||{}).value||''}; }); }
  function readGl(box){ return q(box,'.cs-gp').map(function(g){ var v={}; q(g,'.cs-tx').forEach(function(t){ v[t.dataset.i]=t.value; }); return {n:(g.querySelector('.cs-gpl')||{}).value||'', v:v}; }); }
  function values(sheet){
    var o={};
    q(sheet,'.cs-b').forEach(function(b){o[key(b)]=String(b.dataset.v||'0');});
    q(sheet,'.cs-tx[data-k]').forEach(function(t){o[key(t)]=t.value;});
    q(sheet,'.cs-tl').forEach(function(b){ o.tl=JSON.stringify(readTl(b)); });
    q(sheet,'.cs-gl').forEach(function(b){ o['g'+b.dataset.si]=JSON.stringify(readGl(b)); });
    return o;
  }
  function fit(t){ if(t.scrollHeight>0){ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; } }
  function fitAll(el){ q(el,'.cs-tx').forEach(fit); }
  function apply(sheet, vals){
    var has=function(k){ return Object.prototype.hasOwnProperty.call(vals,k); }, pre=sheet.__pre;
    q(sheet,'.cs-b').forEach(function(b){ var k=key(b); if(has(k)) b.dataset.v=String(vals[k]); });
    q(sheet,'.cs-tx[data-k]').forEach(function(t){ var k=key(t); if(has(k)) t.value=String(vals[k]); });
    if(pre){
      q(sheet,'.cs-tl').forEach(function(box){ var a=has('tl')?parseJ(vals.tl):null; if(a) box.innerHTML=tlRows(pre.examples,pre.count,a); });
      q(sheet,'.cs-gl').forEach(function(box){ var si=+box.dataset.si, a=has('g'+si)?parseJ(vals['g'+si]):null; if(a&&pre.sections[si]) box.innerHTML=gpList(pre.sections[si],pre.layout==='stack',a); });
    }
    q(sheet,'.cs-tx').forEach(fit);
  }

  /* ---------- GitHub ---------- */
  function contentsUrl(path){
    return 'https://api.github.com/repos/'+encodeURIComponent(GH_OWNER)+'/'+encodeURIComponent(GH_REPO)+'/contents/'+path.split('/').map(encodeURIComponent).join('/');
  }
  function headers(auth){ var h={'Accept':'application/vnd.github+json'},tk=getToken(); if(auth&&tk) h.Authorization='Bearer '+tk; return h; }
  function decodeContent(content){ var bin=atob((content||'').replace(/\s/g,'')),bytes=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
  function encodeContent(text){ var bytes=new TextEncoder().encode(text),bin='',step=0x8000; for(var i=0;i<bytes.length;i+=step) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+step)); return btoa(bin); }
  async function getFile(path){
    var r=await fetch(contentsUrl(path)+'?ref='+encodeURIComponent(GH_BRANCH),{headers:headers(!!getToken()),cache:'no-store'});
    if(r.status===404) return null;
    if(!r.ok) throw new Error('データ取得に失敗 ('+r.status+')');
    var j=await r.json();
    return {sha:j.sha,data:JSON.parse(decodeContent(j.content))};
  }

  /* キャラごとの入力値: { id, values(=No.1のシート), sheets:{ "3":{values:{…}} } } */
  async function getRemote(id){
    var f=await getFile(SHEET_DIR+'/'+id+'.json');
    if(!f) return {sha:null,values:{},sheets:{}};
    return {sha:f.sha,values:f.data.values||{},sheets:f.data.sheets||{}};
  }
  // 読み込み→変更→書き込み。競合したら最新を取り直してやり直す。
  async function updateDoc(id, mutate, sheet){
    for(var attempt=0;attempt<4;attempt++){
      var remote=await getRemote(id);
      var doc={id:id,values:remote.values,sheets:remote.sheets};
      mutate(doc);
      var out={id:id};
      if(doc.values&&Object.keys(doc.values).length) out.values=doc.values;
      if(Object.keys(doc.sheets).length) out.sheets=doc.sheets;
      var body={message:'チェックシート更新 ('+id+')',content:encodeContent(JSON.stringify(out,null,2)+'\n'),branch:GH_BRANCH};
      if(remote.sha) body.sha=remote.sha;
      var p=await fetch(contentsUrl(SHEET_DIR+'/'+id+'.json'),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},headers(true)),body:JSON.stringify(body)});
      if(p.ok) return doc;
      if((p.status===409||p.status===422)&&attempt<3){ if(sheet) msg(sheet,'同時編集を検出。最新データと統合して再試行中…'); continue; }
      if(p.status===401||p.status===403) throw new Error('トークンが無効か権限がありません ('+p.status+')。🔑 ボタンから入れ直してください');
      throw new Error('保存に失敗 ('+p.status+')');
    }
    throw new Error('競合が続いたため保存できませんでした。少し待って再度保存してください。');
  }

  /* ---------- プリセット ---------- */
  var presetMemo={}, listMemo=null, indexMemo=null;
  /* data/preset(なければ preset)内の preset-NN.json / NN.json を番号→パスの表にする */
  function presetIndex(){
    if(!indexMemo){
      indexMemo=(async function(){
        var map={}, lastErr=null, found=false;
        for(var d=0; d<PRESET_DIRS.length; d++){
          var r=await fetch(contentsUrl(PRESET_DIRS[d])+'?ref='+encodeURIComponent(GH_BRANCH),{headers:headers(!!getToken()),cache:'no-store'});
          if(r.status===404) continue;
          if(!r.ok){ lastErr=new Error('プリセット一覧を取得できません ('+r.status+')'); continue; }
          var arr=await r.json();
          if(!Array.isArray(arr)) continue;
          found=true;
          arr.forEach(function(f){
            if(f.type&&f.type!=='file') return;
            var m=/^(?:preset-)?(\d+)\.json$/i.exec(f.name||'');
            if(!m) return;
            var n=Number(m[1]);
            if(n>=1&&!map[n]) map[n]=f.path;
          });
        }
        if(!found&&lastErr) throw lastErr;
        return map;
      })();
      indexMemo.catch(function(){ indexMemo=null; });
    }
    return indexMemo;
  }
  function normPreset(d,no){
    var type=d.type==='timeline'?'timeline':d.type==='groups'?'groups':(d.type==='table'||(!d.type&&Array.isArray(d.rows)&&!d.sections))?'table':'slider';
    return {no:no,type:type,name:d.name||d.title||('シート'+no),desc:d.desc||'',layout:d.layout==='stack'?'stack':'',
      count:Math.max(1,Math.min(10,Number(d.count)||3)),examples:Array.isArray(d.examples)?d.examples:[],
      scale:Math.max(2,Math.min(11,Number(d.scale)||11)),sections:Array.isArray(d.sections)?d.sections:[],rows:Array.isArray(d.rows)?d.rows:[]};
  }
  function getPreset(no){
    if(!presetMemo[no]){
      presetMemo[no]=presetIndex().then(function(map){ return map[no]?getFile(map[no]):null; }).then(function(f){ return f?normPreset(f.data,no):null; });
      presetMemo[no].catch(function(){ delete presetMemo[no]; });
    }
    return presetMemo[no];
  }
  function listPresets(force){
    if(force){ presetMemo={}; listMemo=null; indexMemo=null; }
    if(!listMemo){
      listMemo=(async function(){
        var map=await presetIndex();
        var nos=Object.keys(map).map(Number).sort(function(a,b){return a-b;});
        var ps=await Promise.all(nos.map(function(n){ return getPreset(n).catch(function(){return null;}); }));
        return ps.filter(Boolean);
      })();
      listMemo.catch(function(){ listMemo=null; });
    }
    return listMemo;
  }

  /* ---------- プリセット → シートのHTML ---------- */
  // 見出しの幅(em)。全角=1、半角=0.55。\n で区切った行のうち最長のもの
  function tw(str){
    var m=0;
    String(str==null?'':str).split('\n').forEach(function(line){
      var w=0; for(var i=0;i<line.length;i++) w+=line.charCodeAt(i)<256?0.55:1;
      if(w>m) m=w;
    });
    return m;
  }
  // 表の見出し列用: 英数字の種類ごとに幅を見積もる(折り返し防止)
  function twb(str){
    var m=0;
    String(str==null?'':str).split('\n').forEach(function(line){
      var w=0; for(var i=0;i<line.length;i++){ var ch=line.charAt(i), c=line.charCodeAt(i); w+=c<256?(/[A-Z0-9]/.test(ch)?0.75:/[a-z]/.test(ch)?0.64:0.55):1; }
      if(w>m) m=w;
    });
    return m;
  }
  function twbj(str){ return twb(String(str==null?'':str).replace(/\n/g,'')); }
  function twj(str){ return tw(String(str==null?'':str).replace(/\n/g,'')); }   // 改行なしで1行に並べたときの幅(PC用)
  function plS(v){ var n=String(v==null?'':v).split('\n').length; return n>1?' style="--pl:'+n+'"':''; }   // 例表示の行数
  function lb(v){ return esc(v).replace(/\n/g,'<br class="sp">'); }          // \n はスマホだけ改行
  /* 年表の1行(出来事)。入力例(placeholder)は順番に使い回す */
  function tlRow(ex,i,ro,v){
    var p=ex&&ex.length?ex[i%ex.length]:{t:'',d:''}, r=ro===false?'':' readonly';
    v=v||{};
    return '<div class="cs-ev"><span class="cs-dot"></span><div class="cs-evb"><input type="text" class="cs-evt"'+r+' placeholder="'+esc(p.t)+'" value="'+esc(v.t)+'"><textarea class="cs-tx" rows="1"'+r+' placeholder="'+esc(p.d)+'"'+plS(p.d)+'>\n'+esc(v.d)+'</textarea><button type="button" class="cs-evdel" title="この出来事を削除">×</button></div></div>';
  }
  function tlRows(ex,n,list){ var h='',i; if(list){ for(i=0;i<list.length;i++) h+=tlRow(ex,i,true,list[i]); } else { for(i=0;i<n;i++) h+=tlRow(ex,i,true); } return h; }
  /* グループ1つ分(グループ名 + 項目のセット) */
  function gpGroup(sec,stack,ro,v){
    var r=ro===false?'':' readonly', vv=(v&&v.v)||{}, items=sec.items||[], h;
    h='<div class="cs-gp"><div class="cs-gph"><input type="text" class="cs-gpl"'+r+' placeholder="'+esc(sec.groupPh)+'" value="'+esc(v&&v.n)+'"><button type="button" class="cs-gpdel" title="このグループを削除">×</button></div>';
    if(!stack) h+='<table class="cs-tbl"><tbody>';
    items.forEach(function(it,ii){
      var id=it.id||('i'+(ii+1)), ta='<textarea class="cs-tx" rows="1"'+r+' data-i="'+esc(id)+'"'+' placeholder="'+esc(it.ph)+'"'+plS(it.ph)+'>\n'+esc(vv[id])+'</textarea>';
      if(stack) h+='<div class="cs-sr"><div class="cs-sl">'+lb(it.label)+'</div>'+(it.desc?'<div class="cs-sd">'+lb(it.desc)+'</div>':'')+ta+'</div>';
      else h+='<tr><th>'+lb(it.label)+(it.desc?'<span class="cs-d">'+lb(it.desc)+'</span>':'')+'</th><td>'+ta+'</td></tr>';
    });
    if(!stack) h+='</tbody></table>';
    return h+'</div>';
  }
  function gpList(sec,stack,list){
    var h='',i;
    if(list) list.forEach(function(g){ h+=gpGroup(sec,stack,true,g); });
    else for(i=0;i<Math.max(1,Math.min(5,Number(sec.count)||1));i++) h+=gpGroup(sec,stack,true);
    return h;
  }
  function buildSheet(c,id,preset){
    var no=preset.no, n=preset.scale, boxes=new Array(n+1).join('<i></i>'), h='', ml=3, mr=3, mt=0, mld=3, mrd=3, mtd=0, stack=preset.layout==='stack';
    if(preset.type==='groups'){
      (preset.sections||[]).forEach(function(sec,si){
        var gm=0, gmd=0;
        (sec.items||[]).forEach(function(it){ gm=Math.max(gm,twb(it.label)); gmd=Math.max(gmd,twb(it.label)); });
        h+='<div class="cs-s cs-g" style="--thw:'+gm+';--thd:'+gmd+'"><div class="cs-hh"><div class="cs-t">'+lb(sec.title)+'</div>'+(sec.desc?'<div class="cs-hdd">'+lb(sec.desc)+'</div>':'')+'</div>'
          +'<div class="cs-gl" data-si="'+si+'">'+gpList(sec,stack)+'</div>'
          +'<button type="button" class="cs-gadd" data-si="'+si+'">＋ グループを追加</button></div>';
      });
    }
    else if(preset.type==='timeline'){
      h+='<div class="cs-tl">'+tlRows(preset.examples,preset.count)+'</div><button type="button" class="cs-tladd">＋ 出来事を追加</button>';
    }
    else if(preset.type==='table'){
      var groups=[];
      (preset.rows||[]).forEach(function(r){   // 見出しごとに表を分ける
        if(r.heading!==undefined) groups.push({head:r,rows:[]});
        else{ if(!groups.length) groups.push({head:null,rows:[]}); groups[groups.length-1].rows.push(r); }
      });
      groups.forEach(function(g){
        var gm=0, gmd=0;
        g.rows.forEach(function(r){ gm=Math.max(gm,twb(r.label)); gmd=Math.max(gmd,twb(r.label)); });
        h+='<div class="cs-s cs-g" style="--thw:'+gm+';--thd:'+gmd+'">';
        if(g.head) h+='<div class="cs-hh"><div class="cs-t">'+lb(g.head.heading)+'</div>'+(g.head.desc?'<div class="cs-hdd">'+lb(g.head.desc)+'</div>':'')+'</div>';
        if(stack){
          g.rows.forEach(function(r){
            h+='<div class="cs-sr"><div class="cs-sl">'+lb(r.label)+'</div>'+(r.desc?'<div class="cs-sd">'+lb(r.desc)+'</div>':'')
              +'<textarea class="cs-tx" rows="1" readonly placeholder="'+esc(r.ph)+'"'+plS(r.ph)+' data-k="'+esc(r.id)+'"'+plS(r.id)+' id="cs-'+esc(c)+'-p'+no+'-'+esc(r.id)+'"'+plS(r.id)+'></textarea></div>';
          });
        }else if(g.rows.length){
          h+='<table class="cs-tbl"><tbody>';
          g.rows.forEach(function(r){
            mt=Math.max(mt,twb(r.label)); mtd=Math.max(mtd,twb(r.label));
            h+='<tr><th>'+lb(r.label)+(r.desc?'<span class="cs-d">'+lb(r.desc)+'</span>':'')+'</th><td><textarea class="cs-tx" rows="1" readonly placeholder="'+esc(r.ph)+'"'+plS(r.ph)+' data-k="'+esc(r.id)+'"'+plS(r.id)+' id="cs-'+esc(c)+'-p'+no+'-'+esc(r.id)+'"'+plS(r.id)+'></textarea></td></tr>';
          });
          h+='</tbody></table>';
        }
        h+='</div>';
      });
    }
    else (preset.sections||[]).forEach(function(s){
      var cols=s.cols||[];
      h+='<div class="cs-s">';
      if(s.title) h+='<div class="cs-t">'+esc(s.title)+'</div>';
      h+='<div class="cs-cols'+(cols.length<2?' one':'')+'">';
      cols.forEach(function(col){
        h+='<div class="cs-col">';
        if(col.sub) h+='<div class="cs-sub">'+esc(col.sub)+'</div>';
        (col.items||[]).forEach(function(it){
          ml=Math.max(ml,tw(it.l)); mr=Math.max(mr,tw(it.r)); mld=Math.max(mld,twj(it.l)); mrd=Math.max(mrd,twj(it.r));
          h+='<div class="cs-r">';
          if(it.q) h+='<div class="cs-q">'+esc(String(it.q).replace(/^・\s*/,''))+'</div>';
          h+='<div class="cs-line"><span class="cs-l">'+lb(it.l)+'</span><div class="cs-b" id="cs-'+esc(c)+'-p'+no+'-'+esc(it.id)+'" data-k="'+esc(it.id)+'" data-v="0"'+(n%2?' data-m="'+((n+1)/2)+'"':'')+'>'+boxes+'</div><span class="cs-rr">'+lb(it.r)+'</span></div></div>';
        });
        h+='</div>';
      });
      h+='</div></div>';
    });
    var el=document.createElement('div');
    el.className='cs-panel'; el.dataset.c=c; el.dataset.id=id; el.dataset.no=String(no); el.dataset.name=preset.name;
    el.style.setProperty('--wl',(ml+0.4)+'em'); el.style.setProperty('--wr',(mr+0.4)+'em'); el.style.setProperty('--thw',String(mt)); el.style.setProperty('--wld',(mld+0.4)+'em'); el.style.setProperty('--wrd',(mrd+0.4)+'em'); el.style.setProperty('--thd',String(mtd));
    el.innerHTML=(preset.desc?'<div class="cs-desc">'+lb(preset.desc)+'</div>':'')+h;
    el.__pre=preset;
    return el;
  }

  /* ---------- 編集モード(キャラごとに1つ。どのタブを見ていても共通) ---------- */
  function hint(wrap){
    var v=panels(wrap).filter(function(p){ return !p.hidden; })[0];
    if(!v) return '「＋ シート追加」からシートを追加できます';
    return v.querySelector('.cs-b')?'マスをクリックで塗りつぶし（もう一度押すと解除）':'各項目に自由に入力できます';
  }
  function markEmpty(sheet){
    var ed=sheet.classList.contains('ed'), first=true;
    q(sheet,'.cs-g').forEach(function(g){
      var e=true;
      q(g,'.cs-tx,.cs-gpl').forEach(function(t){ if(String(t.value||'').trim()!=='') e=false; });
      var nr=!g.querySelector('.cs-tbl,.cs-sr,.cs-gp');
      g.classList.toggle('cs-empty',e);
      g.classList.toggle('cs-norows',nr);
      var hidden=!ed&&e&&nr;   // 見た目では非表示になるカテゴリ
      g.classList.toggle('cs-first',!hidden&&first);
      if(!hidden) first=false;
    });
  }
  function setMode(wrap,on){
    wrap.classList.toggle('ed',on);
    var ps=panels(wrap), has=ps.length>0;
    ps.forEach(function(p){
      p.classList.toggle('ed',on);
      markEmpty(p);
      q(p,'.cs-tx,.cs-evt,.cs-gpl').forEach(function(t){ t.readOnly=!on; });
      if(on&&!snapshots.has(p)) snapshots.set(p,values(p));
    });
    wrap.querySelector('.cs-edit').hidden=on;
    wrap.querySelector('.cs-cancel').hidden=!on;
    wrap.querySelector('.cs-save').hidden=!on||!has;
    wrap.querySelector('.cs-addsheet').hidden=!on;
    wrap.querySelector('.cs-del').hidden=!on||!has;
    if(!on) wrap.querySelector('.cs-picker').hidden=true;
  }
  function enterEdit(wrap){
    panels(wrap).forEach(function(p){ snapshots.set(p,values(p)); });
    setMode(wrap,true);
    msg(wrap,hint(wrap));
  }
  function refreshKeys(){
    q(root,'.cs-key').forEach(function(k){
      var has=!!getToken();
      k.textContent=has?'🔑':'🔒';
      k.classList.toggle('set',has);
      k.title=has?'トークン入力済み(押すと変更・削除)':'トークンを入力';
    });
  }
  function askToken(wrap){
    var cur=getToken();
    var v=window.prompt('GitHubのトークンを入力してください(Contents: Read and write)。\nこの端末のブラウザ内にだけ保存されます。\n空欄でOKを押すと、保存済みのトークンを削除します。',cur);
    if(v===null) return;
    v=v.trim(); setToken(v); refreshKeys();
    msg(wrap,v?'トークンを設定しました':'トークンを削除しました');
  }

  /* ---------- シートのまとまり(キャラごと)・並び順・プルダウン ---------- */
  function panels(wrap){ return Array.prototype.filter.call(wrap.children,function(el){ return el.classList.contains('cs-panel'); }); }
  // 通し番号の昇順に固定して並べ、プルダウンを作り直す
  function refreshWrap(wrap, selNo){
    var ps=panels(wrap).sort(function(a,b){ return Number(a.dataset.no)-Number(b.dataset.no); });
    ps.forEach(function(p){ wrap.appendChild(p); });
    var sel=wrap.querySelector('.csw-sel');
    if(selNo==null) selNo=sel.value||'';
    if(!ps.some(function(p){ return p.dataset.no===selNo; })) selNo=ps.length?ps[0].dataset.no:'';
    sel.innerHTML=ps.map(function(p){ return '<option value="'+esc(p.dataset.no)+'">'+esc(p.dataset.no+'. '+(p.dataset.name||''))+'</option>'; }).join('');
    if(selNo) sel.value=selNo;
    ps.forEach(function(p){ p.hidden=(p.dataset.no!==selNo); });
    wrap.querySelector('.csw-bar').hidden=!ps.length;
    setMode(wrap,wrap.classList.contains('ed'));
  }
  function makePanel(wrap,no,preset,vals){
    var el;
    if(preset){
      el=buildSheet(wrap.dataset.c,wrap.dataset.id,preset);
      apply(el,vals||{});
    }else{
      el=document.createElement('div');
      el.className='cs-panel cs-missing'; el.dataset.c=wrap.dataset.c; el.dataset.id=wrap.dataset.id;
      el.dataset.no=String(no); el.dataset.name='(読み込み失敗)';
      el.textContent='プリセット No.'+no+' を読み込めませんでした。';
    }
    el.hidden=true;
    wrap.appendChild(el);
    return el;
  }

  /* ---------- シートの追加・削除 ---------- */
  async function openPicker(wrap){
    var pk=wrap.querySelector('.cs-picker'), sel=pk.querySelector('.cs-psel');
    if(!pk.hidden){ pk.hidden=true; return; }
    msg(wrap,'プリセットを読み込み中…');
    var list;
    try{ list=await listPresets(true); }catch(err){ msg(wrap,String(err.message||err),true); return; }
    var have=panels(wrap).map(function(p){ return p.dataset.no; });
    var avail=list.filter(function(p){ return have.indexOf(String(p.no))<0; });
    if(!avail.length){ pk.hidden=true; msg(wrap,list.length?'すべてのプリセットが追加済みです':'プリセットが見つかりません(data/preset に preset-01.json のような名前で置いてください)'); return; }
    sel.innerHTML=avail.map(function(p){ return '<option value="'+p.no+'">'+esc(p.no+'. '+p.name)+'</option>'; }).join('');
    pk.hidden=false; msg(wrap,'追加するシートを選んでください');
  }
  async function addSheet(wrap){
    var pk=wrap.querySelector('.cs-picker'), no=Number(pk.querySelector('.cs-psel').value);
    if(!no) return;
    if(!getToken()){ msg(wrap,'🔒 ボタンからトークンを入力してください',true); return; }
    msg(wrap,'追加中…');
    try{
      var preset=await getPreset(no);
      if(!preset) throw new Error('プリセット No.'+no+' が見つかりません');
      await updateDoc(wrap.dataset.id,function(d){ if(!d.sheets[no]) d.sheets[no]={values:{}}; },wrap);
      var old=panels(wrap).filter(function(p){ return p.dataset.no===String(no); })[0];
      if(old) wrap.removeChild(old);
      makePanel(wrap,no,preset,{});
      pk.hidden=true;
      refreshWrap(wrap,String(no));
      msg(wrap,'「'+preset.name+'」を追加しました。入力して保存してください');
    }catch(err){ msg(wrap,String(err.message||err),true); }
  }
  async function delSheet(wrap){
    var cur=panels(wrap).filter(function(p){ return !p.hidden; })[0]; if(!cur) return;
    var no=cur.dataset.no;
    if(!getToken()){ msg(wrap,'🔒 ボタンからトークンを入力してください',true); return; }
    if(!window.confirm('このシート(No.'+no+' '+(cur.dataset.name||'')+')を削除します。入力した内容も消えます。よろしいですか?')) return;
    msg(wrap,'削除中…');
    try{
      await updateDoc(wrap.dataset.id,function(d){ delete d.sheets[no]; },wrap);
      wrap.removeChild(cur);
      refreshWrap(wrap);
      msg(wrap,'');
    }catch(err){ msg(wrap,String(err.message||err),true); }
  }

  /* ---------- 値の保存(編集中のシートを全部まとめて) ---------- */
  async function save(wrap){
    if(!GH_OWNER||!GH_REPO){ msg(wrap,'GH_OWNER / GH_REPO を設定してください',true); return; }
    if(!getToken()){ msg(wrap,'🔒 ボタンからトークンを入力してください',true); return; }
    var id=wrap.dataset.id, changes={}, any=false;
    panels(wrap).forEach(function(p){
      if(!p.querySelector('.cs-b,.cs-tx,.cs-tl,.cs-gl')) return;
      var base=snapshots.get(p)||{}, local=values(p), ch={};
      Object.keys(local).forEach(function(k){ if(base[k]===undefined?(local[k]!=='0'&&local[k]!==''):local[k]!==String(base[k])) ch[k]=local[k]; });
      if(Object.keys(ch).length){ changes[p.dataset.no]=ch; any=true; }
    });
    if(!any){ setMode(wrap,false); msg(wrap,''); return; }
    msg(wrap,'保存中…');
    try{
      var doc=await updateDoc(id,function(d){
        // 変更したマスだけを反映し、他のマスの最新値は残す。
        Object.keys(changes).forEach(function(no){
          var s=d.sheets[no]=d.sheets[no]||{values:{}}, tgt=s.values=s.values||{};
          Object.keys(changes[no]).forEach(function(k){ tgt[k]=changes[no][k]; });
        });
      },wrap);
      panels(wrap).forEach(function(p){
        var s=doc.sheets[p.dataset.no]; if(s) apply(p,s.values||{});
        snapshots.set(p,values(p));
      });
      setMode(wrap,false); msg(wrap,'');
    }catch(err){ msg(wrap,String(err.message||err),true); }
  }

  /* ---------- イベント ---------- */
  root.addEventListener('click',function(e){
    var t=e.target, wrap=t.closest&&t.closest('.csw'); if(!wrap) return;
    var cl=t.classList;
    if(cl.contains('cs-key')){ askToken(wrap); return; }
    if(cl.contains('cs-edit')){ enterEdit(wrap); return; }
    if(cl.contains('cs-cancel')){ panels(wrap).forEach(function(p){ apply(p,snapshots.get(p)||{}); }); setMode(wrap,false); msg(wrap,''); return; }
    if(cl.contains('cs-save')){ save(wrap); return; }
    if(cl.contains('cs-addsheet')){ openPicker(wrap); return; }
    if(cl.contains('cs-pcancel')){ wrap.querySelector('.cs-picker').hidden=true; return; }
    if(cl.contains('cs-padd')){ addSheet(wrap); return; }
    if(cl.contains('cs-del')){ delSheet(wrap); return; }
    var sh0=t.closest('.cs-panel');
    if(cl.contains('cs-gadd')){
      var gb=sh0&&sh0.querySelector('.cs-gl[data-si="'+t.dataset.si+'"]'), gs=sh0&&sh0.__pre&&sh0.__pre.sections[+t.dataset.si];
      if(gb&&gs) gb.insertAdjacentHTML('beforeend',gpGroup(gs,sh0.__pre.layout==='stack',false));
      return;
    }
    if(cl.contains('cs-gpdel')){ var gp=t.closest('.cs-gp'); if(gp) gp.parentNode.removeChild(gp); return; }
    if(cl.contains('cs-tladd')){
      var tb=sh0&&sh0.querySelector('.cs-tl');
      if(tb) tb.insertAdjacentHTML('beforeend',tlRow(sh0.__pre&&sh0.__pre.examples,tb.children.length,false));
      return;
    }
    if(cl.contains('cs-evdel')){ var ev=t.closest('.cs-ev'); if(ev) ev.parentNode.removeChild(ev); return; }
    if(t.tagName==='I'){
      var sheet=t.closest('.cs-panel');
      if(sheet&&sheet.classList.contains('ed')){
        var bar=t.parentNode, n=Array.prototype.indexOf.call(bar.children,t)+1;
        bar.dataset.v=(bar.dataset.v==n)?'0':String(n);
      }
    }
  });
  root.addEventListener('change',function(e){
    var t=e.target;
    if(t.classList&&t.classList.contains('csw-sel')){
      var w=t.closest('.csw'); refreshWrap(w,t.value); fitAll(w);
      setMode(w,w.classList.contains('ed'));   // 編集中なら、どのシートを見ても編集中(そうでなければ編集中にならない)
      if(w.classList.contains('ed')) msg(w,hint(w));
    }
  });
  root.addEventListener('click',function(e){
    var td=e.target.tagName==='TD'?e.target:null; if(!td||!td.closest('.cs-panel.ed')) return;
    var ta=td.querySelector('.cs-tx'); if(ta&&!ta.readOnly) ta.focus();
  });
  root.addEventListener('input',function(e){ if(e.target.classList&&e.target.classList.contains('cs-tx')) fit(e.target); });

  /* 見出し横のキャラ切り替え: 切り替え後も見出しが画面の同じ位置に残るようにスクロールを補正する */
  root.addEventListener('click',function(e){
    var lb=e.target.closest&&e.target.closest('.csw-head .psi'); if(!lb) return;
    var m=/^hw-v-(\d+)$/.exec(lb.getAttribute('for')||''); if(!m) return;
    var top0=lb.closest('.csw-head').getBoundingClientRect().top, n=m[1], tries=0;
    (function adj(){
      var w=root.querySelector('.csw[data-c="'+n+'"]'), h=w&&w.previousElementSibling;
      if(h&&h.offsetParent!==null){
        var d=h.getBoundingClientRect().top-top0;
        if(Math.abs(d)>1) window.scrollBy(0,d);
      }else if(tries++<10) requestAnimationFrame(adj);
    })();
  });

  /* ---------- 初期化 ---------- */
  q0(root,'.csw').forEach(function(wrap){
    var head=document.createElement('div'); head.className='csw-head';
    head.innerHTML='<div class="csw-title">チェックシート</div>';
    var psw0=root.querySelector('.pnav .psw');
    if(psw0){
      var psw1=psw0.cloneNode(true);   // 上のキャラ切り替えと同じもの(同じスイッチを使うので連動する)
      q0(psw1,'.swb').forEach(function(b){ if(!b.classList.contains('sb-'+wrap.dataset.c)) b.parentNode.removeChild(b); });
      head.appendChild(psw1);
    }
    wrap.parentNode.insertBefore(head,wrap);
    wrap.innerHTML='<div class="cs-h"><div class="csw-bar" hidden><select class="csw-sel"></select></div><span class="cs-ctl"><button type="button" class="cs-key"></button><button type="button" class="cs-edit">✎ 編集</button><button type="button" class="cs-addsheet" hidden>＋ シート追加</button><button type="button" class="cs-del" hidden>シート削除</button><button type="button" class="cs-save" hidden>保存</button><button type="button" class="cs-cancel" hidden>キャンセル</button></span></div>'
      +'<div class="cs-picker" hidden><select class="cs-psel"></select><button type="button" class="cs-padd">追加</button><button type="button" class="cs-pcancel">閉じる</button></div>'
      +'<div class="cs-msg"></div>';
    refreshWrap(wrap);
  });
  refreshKeys();

  // 保存データ(追加済みシート)を読み込む
  if(GH_OWNER&&GH_REPO){
    q0(root,'.csw').forEach(function(wrap){
      getRemote(wrap.dataset.id).then(function(remote){
        var nos=Object.keys(remote.sheets).map(Number).filter(function(n){ return n>=1; });
        return Promise.all(nos.map(function(no){
          return getPreset(no).catch(function(){return null;}).then(function(p){ return {no:no,p:p}; });
        })).then(function(rs){
          rs.forEach(function(r){ makePanel(wrap,r.no,r.p,(remote.sheets[r.no]||{}).values); });
          if(rs.length) refreshWrap(wrap);
        });
      }).catch(function(err){ msg(wrap,'保存データを読み込めませんでした: '+err.message,true); });
    });
  }
}
/* ===== キャラ・ログのデータ読み込み =====
   編集モードの「GitHubへ公開」で書き込まれる data/wheel.html を読み込んで、下の #hw-data に入れます。 */
var DATA_URL = 'https://cheeees.github.io/cheeeestrpg/data/wheel.html';
function hwBoot(){
  var m=document.getElementById('hw-data');
  // データを直接貼り付けた従来の形(#hw-root がすでにある)ときは、そのまま動かします
  if(!m||document.getElementById('hw-root')){ hwInit(); return; }
  fetch(DATA_URL,{cache:'no-cache'}).then(function(r){
    if(!r.ok) throw new Error(r.status);
    return r.text();
  }).then(function(t){
    m.innerHTML=t; hwInit();
  }).catch(function(err){
    m.textContent='データを読み込めませんでした ('+err.message+')';
  });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',hwBoot); else hwBoot();
</script>
