<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>embedプレビュー(editter)</title>
<!--
  ここは editter/main.html(editter 本体)。同じフォルダの editter.css / editter.js が上部のメニューを出す
  (メニューの項目は editter.js の TOOLS で増減できる)。サイト本体は site/main.html で、別物です
  使い方(Chrome / Edge 専用。インストール不要)
  1. このファイルを開く(GitHub Pages の editter/main.html でも、ダブルクリックでもOK。ダブルクリックのときはメニュー用の editter.js / editter.css を同じフォルダに置く)
  2. 「siteフォルダを開く」→ main.html があるフォルダを選ぶ → 「編集を許可」
  3. 左でコードを書く → 右のプレビューにはすぐ反映される。実ファイルへは「💾保存」(Ctrl+S)を押したときだけ書き込む
  ・別のエディタ(VS Codeなど)で保存した変更、style.css / main.js / main.html の変更も自動で反映
  ・新規作成は template_v7.html をコピーして作る(site フォルダに置いておく)
  ・プルダウン先頭の「main.html」を選ぶと、サイト本体(main.html)も同じように編集・自動保存できる
  ・行番号は自動表示(カーソル行はハイライト)
  ■ ショートカットキー(Macは Ctrl → Cmd)
    Ctrl+S          保存
    Ctrl+F          検索を開く(選択中の文字が検索欄に入る)
    Ctrl+H          置換を開く
    Enter / F3      次の一致へ        Shift+Enter / Shift+F3  前の一致へ
    (置換欄で)Enter  今の1件を置換して次へ
    Esc             検索・置換を閉じる
    Ctrl+Z          元に戻す(置換も戻せる)
    ── 以下は「入力補助: ON」のとき ──
    Tab             略語を展開(p / div.cls / card / cols / fold / kv / legend / table / tr / red / blue / side / tabs / spacer / box)
                    展開できないときは半角スペース2つ。複数行を選択中ならまとめてインデント
    Shift+Tab       インデントを戻す(複数行OK)
    Enter           前の行のインデントを引き継ぐ。<p>|</p> の間なら中を改行して整形
    >               <タグ名 ...> の直後で押すと閉じタグを自動挿入
    </              直前の開きタグに合わせて閉じタグを補完
    "               タグの中で " を押すと "" を自動挿入
    Ctrl+/          選択行(なければ現在行)のコメントアウト切り替え
  ・画像は site フォルダの中(img など、どの階層でも)を自動で読み込む
  ■ GitHub につないで編集する場合(フォルダを開く代わり。読み込み〜保存まで GitHub だけで完結)
  1.「🐙 GitHubを開く」→ リポジトリ(例: cheeees/cheeeestrpg)・ブランチ(main)・アクセストークンを入れて「開く」
     ・siteの場所は、サイト本体の main.html があるフォルダ(このサイトでは site)。空欄にすると自動で探す(editter/ の中は除く)
     ・アクセストークンは GitHub の Settings → Developer settings → Fine-grained tokens で作る
       (対象リポジトリだけ選び、Repository permissions の Contents を「Read and write」にする)
  2. 編集 → 右のプレビューに反映(この時点ではまだ GitHub に送られない)
  3.「💾保存」(Ctrl+S)で、変更したファイルをまとめて1回のコミットとして main に送る
     ・GitHub Pages に反映されるまで1〜2分かかる
  ・トークンはこのブラウザの localStorage にだけ保存される(ファイルには書かれない)。共用のパソコンでは「記憶しない」を選ぶ
  ・GitHub モードでは他のエディタでの変更の自動反映はしない(「↻更新」で GitHub の最新を読み直す)
-->

<script>
var $=function(i){return document.getElementById(i)};
var sel=$("sel"),ed=$("ed"),fr=$("fr"),st=$("st"),right=$("right");
var root=null,embedDir=null,imgUrls={},imgLower={},site={},embeds={},handles={},stamps={};
var cur="",dirtySet={},timer=null,blobUrl="",building=false;
var srcMode="folder";   /* "folder"=パソコンのフォルダ / "gh"=GitHub */
var gh={repo:"",branch:"main",dir:"",token:"",head:"",base:"",sha:{},cache:{}};
function status(t){st.textContent=t}
function opened(){return srcMode==="gh"?!!gh.head:!!root}

/* ---------- GitHub API ---------- */
function encPath(p){return p.split("/").map(encodeURIComponent).join("/")}
async function ghApi(path,opt){
  opt=opt||{};
  var h={"Accept":opt.raw?"application/vnd.github.raw+json":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  if(gh.token)h["Authorization"]="Bearer "+gh.token;
  if(opt.body)h["Content-Type"]="application/json";
  var r=await fetch("https://api.github.com/repos/"+gh.repo+path,{method:opt.method||"GET",headers:h,body:opt.body?JSON.stringify(opt.body):undefined,cache:"no-store"});
  if(!r.ok){
    var m="";try{m=(await r.json()).message||""}catch(e){}
    var hint=r.status===401?"(トークンが正しくないか期限切れです)":
      r.status===403?"(権限不足、または回数制限です)":
      r.status===404?"(リポジトリ・ブランチ名が違うか、トークンにこのリポジトリの権限がありません)":"";
    throw new Error(r.status+" "+m+hint);
  }
  return opt.raw?r.text():r.json();
}
/* 中身は sha ごとに覚えておき、同じものは取り直さない */
async function ghBlob(sha){
  if(!sha)return "";
  if(gh.cache[sha]!=null)return gh.cache[sha];
  var t=await ghApi("/git/blobs/"+sha,{raw:true});
  gh.cache[sha]=t;return t;
}
function ghH(rel){var p=gh.base+rel;return {gh:true,path:p,sha:gh.sha[p]||""}}
/* GitHub から読み込む: ブランチの最新 → ファイル一覧 → main.html / css / js / embed / 画像 */
async function ghScan(){
  var ref=await ghApi("/git/ref/heads/"+encPath(gh.branch));
  gh.head=ref.object.sha;
  var tr=await ghApi("/git/trees/"+gh.head+"?recursive=1");
  if(tr.truncated)status("ファイルが多すぎて一覧が途中までです");
  gh.sha={};
  tr.tree.forEach(function(e){if(e.type==="blob")gh.sha[e.path]=e.sha});
  var base="";
  var dir=(gh.dir||"").replace(/^\/+|\/+$/g,"");
  if(dir){
    base=dir+"/";
    if(!gh.sha[base+"main.html"]){alert(dir+"/main.html が見つかりません。\nsiteの場所を確認してください。");gh.head="";return false}
  }else{
    /* editter/ 自身の main.html は、サイト本体ではないので候補から外す */
    var c=Object.keys(gh.sha).filter(function(p){return (p==="main.html"||/\/main\.html$/.test(p))&&!/(^|\/)editter\/main\.html$/.test(p)})
      .sort(function(a,b){return a.split("/").length-b.split("/").length});
    if(!c.length){alert("リポジトリの中に main.html が見つかりません。\nブランチ名・リポジトリ名を確認してください。");gh.head="";return false}
    base=c[0].slice(0,-9);
  }
  gh.base=base;
  Object.keys(handles).forEach(function(k){delete handles[k]});
  site={};stamps={};embeds={};embedDir=null;
  var mh=ghH("main.html");
  site["main.html"]=(await readFile(mh)).text;stamps["main.html"]=0;handles["main.html"]=mh;
  await loadAssets();
  var names=Object.keys(gh.sha).filter(function(p){
    return p.indexOf(base+"embed/")===0&&p.slice(base.length+6).indexOf("/")<0&&/\.html$/.test(p)});
  await Promise.all(names.map(async function(p){
    var n=p.slice(base.length+6),h=ghH("embed/"+n);
    embeds[n]=(await readFile(h)).text;stamps["embed/"+n]=0;handles["embed/"+n]=h;
  }));
  /* 画像などは raw.githubusercontent.com の URL をそのままプレビューに渡す(読み込まずに済む) */
  Object.keys(imgUrls).forEach(function(k){URL.revokeObjectURL(imgUrls[k])});imgUrls={};imgLower={};
  var rawBase="https://raw.githubusercontent.com/"+gh.repo+"/"+encPath(gh.branch)+"/";
  Object.keys(gh.sha).forEach(function(p){
    if(p.indexOf(base)!==0||!MEDIA_RE.test(p)||/(^|\/)(node_modules|\.git|\.vscode|\.idea)\//.test(p))return;
    imgUrls[p.slice(base.length)]=rawBase+encPath(p);
  });
  Object.keys(imgUrls).forEach(function(k){imgLower[k.toLowerCase()]=imgUrls[k]});
  return true;
}
/* 変更したファイルを、1回のコミットにまとめて GitHub に送る。送ったら true */
async function ghSave(keys){
  var ref=await ghApi("/git/ref/heads/"+encPath(gh.branch)),head=ref.object.sha;
  if(head!==gh.head&&!confirm("GitHub 側が、読み込んだ後に更新されています(別の場所で保存した可能性があります)。\n今編集しているファイルだけを上書きして保存しますか?\n(ほかのファイルは GitHub 側の最新のまま残ります)"))return false;
  var commit=await ghApi("/git/commits/"+head);
  var items=[],texts={};
  for(var k of keys){
    var t=getText(k);texts[k]=t;
    var b=await ghApi("/git/blobs",{method:"POST",body:{content:t,encoding:"utf-8"}});
    items.push({path:gh.base+k,mode:"100644",type:"blob",sha:b.sha});
  }
  var tree=await ghApi("/git/trees",{method:"POST",body:{base_tree:commit.tree.sha,tree:items}});
  var msg="editterから更新: "+keys.join(", ");
  var nc=await ghApi("/git/commits",{method:"POST",body:{message:msg,tree:tree.sha,parents:[head]}});
  await ghApi("/git/refs/heads/"+encPath(gh.branch),{method:"PATCH",body:{sha:nc.sha}});
  gh.head=nc.sha;
  items.forEach(function(it,i){gh.sha[it.path]=it.sha;gh.cache[it.sha]=texts[keys[i]];if(handles[keys[i]])handles[keys[i]].sha=it.sha});
  return true;
}

if(!window.showDirectoryPicker){
  document.body.innerHTML='<div id="msg">このツールは <b>Chrome / Edge</b>(パソコン版)で開いてください。<br>Firefox・Safari・スマホでは、フォルダへの保存機能が使えません。</div>';
}

/* ---------- フォルダの読み込み ---------- */
async function readFile(h){
  if(h.gh)return {text:await ghBlob(h.sha),t:0};
  var f=await h.getFile();return {text:await f.text(),t:f.lastModified}}
/* フォルダ内のパス("css/style.css" など)からファイルを取る */
async function getByPath(p){
  if(srcMode==="gh"){
    var out=[];p.split("/").forEach(function(x){if(x===".."&&out.length)out.pop();else if(x&&x!=="."&&x!=="..")out.push(x)});
    var full=gh.base+out.join("/");
    return gh.sha[full]?{gh:true,path:full,sha:gh.sha[full]}:null;
  }
  var parts=p.replace(/^\.\//,"").split("/").filter(Boolean),d=root;
  try{
    for(var i=0;i<parts.length-1;i++)d=await d.getDirectoryHandle(parts[i]);
    return await d.getFileHandle(parts[parts.length-1]);
  }catch(e){return null}
}
function localPath(h){return h&&!/^(https?:)?\/\/|^data:|^\//.test(h)?h.split(/[?#]/)[0]:null}
var JS_RE=/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*>\s*<\/script>/gi;
function cssHref(tag){
  if(!/rel=["']stylesheet["']/i.test(tag))return null;
  return localPath((tag.match(/href=["']([^"']+)["']/i)||[])[1]);
}
/* main.html が読んでいる css / js を、書かれているパスのとおりに読み込む(最新の main.html に追従) */
async function loadAssets(){
  Object.keys(handles).forEach(function(k){if(k.indexOf("a:")===0){delete handles[k];delete site[k];delete stamps[k]}});
  var html=site["main.html"],list=[],missing=[];
  (html.match(/<link\b[^>]*>/gi)||[]).forEach(function(t){var p=cssHref(t);if(p)list.push(p)});
  html.replace(JS_RE,function(a,s){var p=localPath(s);if(p)list.push(p);return a});
  for(var p of list){
    var fh=await getByPath(p);
    if(fh){var r=await readFile(fh);site["a:"+p]=r.text;stamps["a:"+p]=r.t;handles["a:"+p]=fh}else missing.push(p);
  }
  if(missing.length)status("見つからない: "+missing.join(", "));
}
var MEDIA_RE=/\.(png|jpe?g|gif|webp|svg|avif|ico|bmp|mp4|webm|mp3|ogg|wav|woff2?|ttf|otf)$/i;
var SKIP_DIR=/^(\.git|node_modules|\.vscode|\.idea)$/;
async function walkImg(dir,prefix){
  for await(var [n,h] of dir.entries()){
    if(h.kind==="file"){if(MEDIA_RE.test(n))imgUrls[prefix+n]=URL.createObjectURL(await h.getFile())}
    else if(!SKIP_DIR.test(n))await walkImg(h,prefix+n+"/");
  }
}
async function scan(){

  }
  if(e.key===">"&&!sel){
    var m=before.match(/<([a-zA-Z][\w-]*)(\s[^<>]*)?$/);
    if(m&&!VOID.test(m[1])&&!/\/$/.test(before)){e.preventDefault();ins("></"+m[1]+">");setCur(L.s+1)}
    return;
  }
  if(e.key==="/"&&!sel&&/<$/.test(before)){
    var nm=openTagBefore(before.slice(0,-1));
    if(nm){e.preventDefault();ins("/"+nm+">")}
    return;
  }
  if(e.key==='"'&&!sel&&/<[a-zA-Z][^<>]*$/.test(before)){
    e.preventDefault();
    if(after.charAt(0)==='"')setCur(L.s+1);else{ins('""');setCur(L.s+1)}
    return;
  }
  if(e.key==="Tab"){
    e.preventDefault();
    if(e.shiftKey){blockEdit(function(ls){return ls.map(function(l){return l.replace(/^( {1,2}|\t)/,"")})});return}
    if(sel&&ed.value.slice(ed.selectionStart,ed.selectionEnd).indexOf("\n")>=0){blockEdit(function(ls){return ls.map(function(l){return "  "+l})});return}
    if(!sel&&expandAbbr())return;
    ins("  ");return;
  }
  if(e.key==="/"&&(e.ctrlKey||e.metaKey)){
    e.preventDefault();
    blockEdit(function(ls){
      var all=ls.every(function(l){return /^\s*<!-- .* -->\s*$/.test(l)||!l.trim()});
      return ls.map(function(l){if(!l.trim())return l;
        return all?l.replace(/^(\s*)<!-- (.*) -->\s*$/,"$1$2"):l.replace(/^(\s*)(.*)$/,"$1<!-- $2 -->")});
    });
  }
});

/* テンプレート探し: site直下 と embed の中の template*.html(複数あれば名前が一番新しい版)。
   なければファイルを選んでもらい、site直下に template_v7.html として保存する */
async function findTemplate(){
  if(srcMode==="gh"){
    var gn2=Object.keys(gh.sha).filter(function(p){
      if(p.indexOf(gh.base)!==0)return false;
      return /^(embed\/)?template[^\/]*\.html$/i.test(p.slice(gh.base.length));
    }).sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true})});
    if(gn2.length){var gu=gn2[gn2.length-1];status("テンプレート: "+gu);return await ghBlob(gh.sha[gu])}
    alert("リポジトリに template_v7.html が見つかりません。\nテンプレートのファイルを選んでください。");
    try{
      var gp=await showOpenFilePicker({types:[{description:"HTML",accept:{"text/html":[".html"]}}]});
      return (await readFile(gp[0])).text;
    }catch(e){
      return confirm("テンプレートなしの空ファイルで作りますか?")?"":null;
    }
  }
  var c=[];
  async function look(dir,prefix){
    for await(var [n,h] of dir.entries()){
      if(h.kind==="file"&&/^template.*\.html$/i.test(n))c.push({name:prefix+n,h:h});
    }
  }
  await look(root,"");await look(embedDir,"embed/");
  if(c.length){
    c.sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true})});
    var u=c[c.length-1];status("テンプレート: "+u.name);
    return (await readFile(u.h)).text;
  }
  alert("site フォルダに template_v7.html が見つかりません。\nテンプレートのファイルを選んでください(site フォルダにコピーして、次回から自動で使います)。");
  try{
    var hs=await showOpenFilePicker({types:[{description:"HTML",accept:{"text/html":[".html"]}}]});
    var text=(await readFile(hs[0])).text;
    var nh=await root.getFileHandle("template_v7.html",{create:true});
    var w=await nh.createWritable();await w.write(text);await w.close();
    return text;
  }catch(e){
    return confirm("テンプレートなしの空ファイルで作りますか?")?"":null;
  }
}

/* ---------- 行番号・現在行ハイライト ---------- */
var gutBox=$("gut"),gn=$("gn"),gcur=$("gcur"),clEl=$("cl"),bd=$("bd"),bdt=$("bdt");
var LH=20,PAD=10,lastLines=0,curLine=0;
function escH(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function lineOf(p){var v=ed.value,n=0,i=-1;while((i=v.indexOf("\n",i+1))>=0&&i<p)n++;return n}
function placeCur(){
  var y=PAD+curLine*LH;
  gcur.style.top=y+"px";
  clEl.style.transform="translateY("+(y-ed.scrollTop)+"px)";
}
function updateCur(){curLine=lineOf(ed.selectionStart);placeCur()}
function syncScroll(){gutBox.scrollTop=ed.scrollTop;bd.scrollTop=ed.scrollTop;bd.scrollLeft=ed.scrollLeft;placeCur()}
function refreshEd(){
  var v=ed.value,n=1,i=-1;
  while((i=v.indexOf("\n",i+1))>=0)n++;
  if(n!==lastLines){
    lastLines=n;
    var a=new Array(n);for(var k=0;k<n;k++)a[k]=k+1;
    gn.textContent=a.join("\n");
    gutBox.style.width="calc("+Math.max(2,String(n).length)+"ch + 20px)";
  }
  renderFind();updateCur();syncScroll();
}
ed.addEventListener("input",refreshEd);
ed.addEventListener("scroll",syncScroll);
document.addEventListener("selectionchange",function(){if(document.activeElement===ed)updateCur()});

/* ---------- 検索・置換 ---------- */
var fbar=$("fbar"),fi=$("fi"),ri=$("ri"),fcnt=$("fcnt"),fCase=false,fReg=false,M=[],mi=-1;
function buildRe(){
  var q=fi.value;if(!q){fi.classList.remove("bad");return null}
  try{
    var src=fReg?q:q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    var re=new RegExp(src,"g"+(fCase?"":"i")+"m");fi.classList.remove("bad");return re;
  }catch(e){fi.classList.add("bad");return null}
}
function findAll(){
  M=[];var re=buildRe();if(!re)return;
  var v=ed.value,m;
  while((m=re.exec(v))){
    if(m[0]===""){re.lastIndex++;continue}
    M.push({s:m.index,e:m.index+m[0].length});
    if(M.length>=5000)break;
  }
}
/* カーソル位置以降で最初の一致を「現在」にする */
function pickNear(){
  mi=-1;if(!M.length)return;
  var p=ed.selectionStart;
  for(var i=0;i<M.length;i++){if(M[i].s>=p){mi=i;break}}
  if(mi<0)mi=0;
}
function renderMarks(){
  if(fbar.hidden){bdt.textContent="";fcnt.textContent="";return}
  var v=ed.value,h="",last=0,lim=Math.min(M.length,3000);
  for(var i=0;i<lim;i++){
    h+=escH(v.slice(last,M[i].s))+'<mark'+(i===mi?' class="cur"':'')+'>'+escH(v.slice(M[i].s,M[i].e))+'</mark>';
    last=M[i].e;
  }
  bdt.innerHTML=h+escH(v.slice(last))+"\n";
  fcnt.textContent=M.length?(mi+1)+" / "+M.length+(M.length>=5000?"+":""):(fi.value?"0件":"");
  bd.scrollTop=ed.scrollTop;bd.scrollLeft=ed.scrollLeft;
}
function renderFind(){if(fbar.hidden)return;findAll();pickNear();renderMarks()}
var cvs=document.createElement("canvas").getContext("2d");
function scrollToPos(p){
  var v=ed.value,line=lineOf(p),y=PAD+line*LH;
  if(y<ed.scrollTop+LH||y+LH>ed.scrollTop+ed.clientHeight-LH*2)ed.scrollTop=Math.max(0,y-ed.clientHeight/2);
  var ls=v.lastIndexOf("\n",p-1)+1;
  cvs.font=getComputedStyle(ed).font;
  var w=cvs.measureText("0").width,x=PAD+v.slice(ls,p).replace(/\t/g,"  ").length*w;
  if(x<ed.scrollLeft+20||x>ed.scrollLeft+ed.clientWidth-80)ed.scrollLeft=Math.max(0,x-ed.clientWidth/3);
}
function show(k){
  mi=k;var m=M[k];
  ed.setSelectionRange(m.s,m.e);
  scrollToPos(m.s);renderMarks();updateCur();syncScroll();
}
function step(dir){
  if(!M.length)return;
  var a=ed.selectionStart,b=ed.selectionEnd,k=-1;
  if(M[mi]&&M[mi].s===a&&M[mi].e===b)k=mi+dir;
  else if(dir>0){for(var i=0;i<M.length;i++)if(M[i].s>=b){k=i;break}}
  else{for(var j=M.length-1;j>=0;j--)if(M[j].e<=a){k=j;break}}
  if(k>=M.length)k=0;
  if(k<0)k=dir>0?0:M.length-1;
  show(k);
}
function incSearch(){findAll();pickNear();if(M.length)show(mi);else renderMarks()}
function expandRep(m,s){
  return s.replace(/\$(\d{1,2}|&|\$)|\\([nt\\])/g,function(x,a,b){
    if(b)return b==="n"?"\n":b==="t"?"\t":"\\";
    if(a==="$")return "$";if(a==="&")return m[0];
    var n=+a;return m[n]!=null?m[n]:x;
  });
}
function replOne(){
  if(!M.length)return;
  var a=ed.selectionStart,b=ed.selectionEnd,k=-1;
  for(var i=0;i<M.length;i++)if(M[i].s===a&&M[i].e===b){k=i;break}
  if(k<0){step(1);return}
  var re=buildRe();if(!re)return;
  re.lastIndex=a;var m=re.exec(ed.value);if(!m||m.index!==a)return;
  var out=fReg?expandRep(m,ri.value):ri.value,act=document.activeElement;
  ed.focus();ed.setSelectionRange(a,b);ins(out);   /* 入力扱いなので Ctrl+Z で戻せる */
  if(M.length)show(mi);
  if(act&&act!==ed)act.focus();
}
function replAll(){
  var re=buildRe();if(!re||!M.length)return;
  var v=ed.value,rv=ri.value,res="",last=0,cnt=0,m;
  while((m=re.exec(v))){
    if(m[0]===""){re.lastIndex++;continue}
    res+=v.slice(last,m.index)+(fReg?expandRep(m,rv):rv);last=m.index+m[0].length;cnt++;
  }
  res+=v.slice(last);
  if(res===v)return;
  var act=document.activeElement,top=ed.scrollTop,left=ed.scrollLeft;
  ed.focus();ed.select();ins(res);
  ed.scrollTop=top;ed.scrollLeft=left;syncScroll();
  if(act&&act!==ed)act.focus();
  status(cnt+" 件を置換しました(Ctrl+Z で元に戻せます)");
}
function openFind(toReplace){
  fbar.hidden=false;
  var s=ed.value.slice(ed.selectionStart,ed.selectionEnd);
  if(s&&s.indexOf("\n")<0)fi.value=s;
  renderFind();
  var t=toReplace?ri:fi;t.focus();t.select();
}
function closeFind(){fbar.hidden=true;renderMarks();ed.focus()}
fi.addEventListener("input",incSearch);
$("fcase").onclick=function(){fCase=!fCase;this.classList.toggle("on",fCase);incSearch()};
$("freg").onclick=function(){fReg=!fReg;this.classList.toggle("on",fReg);incSearch()};
$("fnext").onclick=function(){step(1)};
$("fprev").onclick=function(){step(-1)};
$("fclose").onclick=closeFind;
$("rone").onclick=replOne;
$("rall").onclick=replAll;
fi.addEventListener("keydown",function(e){
  if(e.isComposing||e.keyCode===229)return;
  if(e.key==="Enter"){e.preventDefault();step(e.shiftKey?-1:1)}
  else if(e.key==="Escape"){e.preventDefault();closeFind()}
});
ri.addEventListener("keydown",function(e){
  if(e.isComposing||e.keyCode===229)return;
  if(e.key==="Enter"){e.preventDefault();replOne()}
  else if(e.key==="Escape"){e.preventDefault();closeFind()}
});
document.addEventListener("keydown",function(e){
  var k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&(k==="f"||k==="h")){
    if(!cur)return;e.preventDefault();openFind(k==="h");
  }else if(e.key==="F3"&&!fbar.hidden){e.preventDefault();step(e.shiftKey?-1:1)}
  else if(e.key==="Escape"&&!fbar.hidden&&document.activeElement===ed){closeFind()}
});
refreshEd();
